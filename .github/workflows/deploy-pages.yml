name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build static site
        env:
          GITHUB_PAGES_BASE: /porfolio-hafsa/
        run: bun run build
      - name: Prepare artifact
        run: |
          set -e
          if [ -d .output/public ]; then SRC=.output/public; else SRC=dist/client; fi
          echo "Publishing $SRC"
          ls -la "$SRC"
          cp "$SRC/index.html" "$SRC/404.html"
          touch "$SRC/.nojekyll"
          echo "SRC=$SRC" >> $GITHUB_ENV
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SRC }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
