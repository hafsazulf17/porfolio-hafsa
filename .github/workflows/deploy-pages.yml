name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Pages source to GitHub Actions (stop README publishing)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
            && echo "Pages source set to GitHub Actions" \
            || echo "Could not change Pages source automatically"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build static site
        env:
          GITHUB_PAGES_BASE: /porfolio-hafsa/
        run: bun run build
      - name: Prepare artifact
        run: |
          set -e
          if [ -d .output/public ]; then SRC=.output/public; else SRC=dist/client; fi
          echo "Publishing $SRC"
          ls -la "$SRC"
          cp "$SRC/index.html" "$SRC/404.html"
          touch "$SRC/.nojekyll"
          echo "SRC=$SRC" >> $GITHUB_ENV
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SRC }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for any README (branch) publish to finish so the portfolio deploys last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            ACTIVE=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.name=="pages build and deployment" and .status!="completed")] | length' || echo 0)
            if [ "$ACTIVE" = "0" ]; then echo "No branch publish running"; break; fi
            echo "Branch publish still running, waiting..."; sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
